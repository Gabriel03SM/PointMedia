services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pointmedia
      POSTGRES_USER: pointmedia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
      TZ: UTC
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pointmedia -d pointmedia']
      interval: 5s
      timeout: 5s
      retries: 10
  db-test:
    image: postgres:17-alpine
    profiles: [test]
    environment:
      POSTGRES_DB: pointmedia_test
      POSTGRES_USER: pointmedia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
      TZ: UTC
    ports:
      - '127.0.0.1:5433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pointmedia -d pointmedia_test']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
